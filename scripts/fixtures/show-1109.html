<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAU 세로 보기</title>
<style>
@font-face { font-family: "HBN"; font-weight: 400;
  src: local("Hakgyoansim Bareondotum NarrowSpace R"), local("HakgyoansimBareondotumNarrowSpaceR"), url("../fonts/HakgyoansimBareondotumNarrowSpaceR.woff2") format("woff2"); }
/* 세로 65인치 한 화면에 그림 하나. 조작은 아래 끝에 마우스를 대면 뜨는 줄과 설정 창에만 있다.
   글자 한 크기 · 한 색 · 한 두께, 켠 상태는 반전, 괘선은 가로 잉크 선. 수치는 바탕글(--base) 배율 */
:root {
  --base: max(15px, 1.5vmin); font-size: var(--base);
  --g1: .5rem; --g2: 1rem; --g3: 1.5rem;
  --caption: calc(1rem * 5 / 6);
  --bg: #0d0d0d; --ink: #ece9e3;
  --ease: 160ms;
  --line: max(1px, calc(var(--base) / 16));   /* 괘선 — 4K 세로(바탕글 32px)에서도 1080과 같은 굵기로 보이게 */
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "HBN", system-ui, sans-serif; overflow: hidden; word-break: keep-all; }
body.idle { cursor: none; }
.stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.frame { position: absolute; transition: transform var(--ease) ease-out, opacity var(--ease) ease-out; }
.frame.leave { transform: translateY(-6%); opacity: 0; }
.frame.enter { transform: translateY(6%); opacity: 0; transition: none; }
.frame.back.leave { transform: translateY(6%); } .frame.back.enter { transform: translateY(-6%); }
.frame > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 0; }
#vid { visibility: hidden; } body.raw #vid { visibility: visible; } body.raw #out { visibility: hidden; }
#live { display: none; pointer-events: none; background: var(--bg); } body.live #live { display: block; } body.live #out, body.live #vid { display: none; }

/* 아래 줄: 평소엔 보이지 않고, 아래 끝에 마우스를 대거나 설정 창이 열려 있으면 뜬다 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: var(--g1) var(--g3); padding: var(--g1) var(--g2);
  border-top: var(--line) solid var(--ink); background: var(--bg); opacity: 0; transition: opacity var(--ease); }
body.dock-on .dock { opacity: 1; }
.dock .pos { font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .grp { display: flex; } .dock .grp:last-child { margin-left: auto; }

.panel { position: fixed; left: var(--g2); bottom: calc(var(--g1) * 2 + 1rem + var(--g1) * 1.2 + var(--line) * 2 + var(--g2)); width: min(34rem, calc(100vw - var(--g2) * 2));
  max-height: calc(100vh - 8rem); overflow: auto; scrollbar-width: none; background: var(--bg); border: var(--line) solid var(--ink); display: none; }
.panel::-webkit-scrollbar { display: none; }
body.panel-on .panel { display: grid; }
.pcol + .pcol { border-top: var(--line) solid var(--ink); }
/* 가로 화면(데스크톱)은 설정과 목록을 두 단으로 — 한 단이면 화면보다 길어진다 */
@media (min-aspect-ratio: 1/1) and (min-width: 900px) {
  .panel { width: min(68rem, calc(100vw - var(--g2) * 2)); grid-template-columns: 1fr 1fr; }
  .pcol + .pcol { border-top: 0; border-left: var(--line) solid var(--ink); }
}
.row { display: grid; grid-template-columns: 7rem 1fr; gap: var(--g1); align-items: center; padding: var(--g1) var(--g2); border-top: var(--line) solid var(--ink); }
.row:first-child { border-top: 0; }
.seg { display: flex; flex-wrap: wrap; } .seg button + button { border-left: 0; } .seg button { padding-inline: calc(var(--g1) * 1.2); }
.ctl { display: flex; align-items: center; gap: var(--g1); }
.row > * { min-width: 0; }
.list { display: grid; } .list button { text-align: left; border-top: 0; overflow: hidden; text-overflow: ellipsis; } .list button:first-child { border-top: var(--line) solid var(--ink); }
.keys { font-size: var(--caption); line-height: 1.6; } .keys span { white-space: nowrap; margin-right: 1em; }
button { font: inherit; color: var(--ink); background: transparent; border: var(--line) solid var(--ink); border-radius: 0; padding: calc(var(--g1) * .6) var(--g2); cursor: pointer; white-space: nowrap; }
button.on { background: var(--ink); color: var(--bg); }
button:hover { text-decoration: underline; }
input[type=range] { flex: 1; accent-color: var(--ink); }
output { width: 2rem; text-align: right; font-variant-numeric: tabular-nums; }
.list button:disabled { cursor: default; opacity: .45; } .list button:disabled:hover { text-decoration: none; }
.note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: var(--g1) var(--g2); border: var(--line) solid var(--ink); background: var(--bg); display: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
body.noting #note { display: block; }
body.loading #load { display: block; } body.loading.noting #load { display: none; }
</style>
</head>
<body class="dock-on loading">
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <canvas id="out"></canvas>
    <video id="vid" muted playsinline preload="auto"></video>
    <iframe id="live" title="실시간 푸빌라 미믹" allow="camera; autoplay; fullscreen" tabindex="-1"></iframe>
  </div>
</div>
<div class="note" id="note"></div>
<div class="note" id="load" role="status">불러오는 중</div>

<div class="panel" id="panel" role="dialog" aria-label="설정">
 <div class="pcol">
  <div class="row"><span>필터</span><div class="seg" id="filters"></div></div>
  <div class="row"><label for="level">필터 세기</label><div class="ctl"><input type="range" id="level" min="0" max="100" step="1"><output id="levelO"></output></div></div>
  <div class="row"><span>캐릭터 노말</span><div class="seg"><button id="normal"></button></div></div>
  <div class="row"><span>기준 프레임수</span><div class="seg" id="fpss"></div></div>
  <div class="row"><span>속도 기준</span><div class="seg" id="bases"></div></div>
  <div class="row"><span>재생 속도(배율)</span><div class="seg" id="rates"></div></div>
  <div class="row"><span>자동 넘김</span><div class="seg" id="autos"></div></div>
  <div class="row"><span>화면</span><div class="seg" id="fits"></div></div>
  <div class="row"><span>필터 해상도</span><div class="seg" id="ress"></div></div>
  <div class="row"><span>결 크기</span><div class="seg" id="grains"></div></div>
  <div class="row"><span>에셋별 기본</span><div class="seg" id="peritems"></div></div>
  <div class="row"><span>전체 화면</span><div class="seg"><button id="full">켜기</button></div></div>
 </div>
 <div class="pcol">
  <div class="row"><span>목록</span><div class="list" id="list"></div></div>
  <div class="row"><span>단축키</span><div class="keys"><span>↑ ↓ · 휠 · 끌기 넘기기</span> <span>0 원본 · 1 2 3 필터 버전</span> <span>[ ] 세기</span> <span>- = 프레임수</span> <span>N 노말</span> <span>B 속도 기준</span> <span>Space 멈춤</span> <span>F 전체 화면</span> <span>S 설정</span> <span>Esc 닫기</span></div></div>
 </div>
</div>
<div class="dock" id="dock">
  <div class="grp"><button id="prev" aria-label="이전">↑</button><button id="next" aria-label="다음">↓</button></div>
  <span class="pos" id="pos"></span>
  <div class="grp"><button id="open">설정</button></div>
</div>

<script type="module">
import { createFilter, loadMaskSequence, FILTERS } from "../nau-filter/nau-filter.js";

const $ = id => document.getElementById(id);
const ITEMS = (await (await fetch("items.json", { cache: "no-cache" })).json()).items;
const q = new URLSearchParams(location.search);
const SAVE = "nau-show";
const saved = (() => { try { return JSON.parse(localStorage.getItem(SAVE)) || {}; } catch (e) { return {}; } })();
const pick = (k, d, f = x => x) => q.has(k) ? f(q.get(k)) : (saved[k] ?? d);
// filter: "off"(원본) | A — 유화 50(사용자 10/23 "A50이 되게 좋네"). 크레용 B · 크레용 페이퍼 C는 11/09 재연 님 결정으로 이 웹에서 뺐다(갤러리 · 모듈에는 남음).
// v = 유화 필터 버전(11/09 재연 님 "기본 필터 적용 값을 1번, 개선된 필터를 2번 3번 이런 식으로 버전마다 쌓아가보자") — 아래 VERSIONS. 재생은 항목별 기준 배속 × 속도 기준 × 배율
// basis = 속도 기준: 64 = 화면 속 동작 빠르기를 70번 1분 판(1:04)과 같게(기본, 재연 님 10/23 저녁 "기준점은 1분 4초 판 속도감"), 90 = 1분 30초 기준(× 64/90).
//   항목 배속(items.json speed · speeds)은 그 빠르기가 되도록 소스마다 따로 잡은 값이고, 속도 기준은 그 위에 곱하는 배율
// 목록 = 판 고르기 없이 하나로(10/26 재연 님 "스리디판1 - 평면판1 - 스리디판2 - 평면판2 이런 식으로 그냥 쭉 쭉 넘기면서 모든 영상 에셋들을 볼 수 있게"):
//   두 판이 있는 항목은 3D판 바로 다음에 평면판. 예전 ?ver=3d|flat|both&i= 주소는 그때 순서표(LEGACY)로 같은 장을 찾아 연다
// auto = 자동 넘김: 0 = 끔(기본, 각 영상 반복 재생 · ↑↓로 넘김), -1 = 영상 끝나면 다음, 8 · 16 = 그 초마다. 예전 저장값(auto · auto2)은 무시하고 auto3만
const st = { i: Math.max(0, +(q.get("i") ?? 0)), filter: pick("filter", "A"), v: String(pick("v", "1")), level: pick("level", 50, Number),
  normal: pick("normal", false, v => v !== "0" && v !== "false"), normal3d: pick("normal3d", false, v => v === "1" || v === "true"), rateMul: pick("rateMul", 1, Number), fps: pick("fps", 0, Number), fine: pick("fine", null, v => v === "" ? null : Number(v)), auto: q.has("auto") ? +q.get("auto") : (saved.auto3 ?? 0), fit: pick("fit", innerWidth > innerHeight ? "contain" : "cover"),   // 가로 화면(데스크톱)은 맞추기가 기본 — 채우면 세로 그림 위아래가 크게 잘린다
  basis: pick("basis", 64, Number),
  // 10/24 65인치: res = 필터 처리 해상도(auto = 화면 실제 화소에 맞춰 2160 · 1440 · 1080, 버벅이면 내림), grain = 결 크기 배율(해상도 배율 위에 곱함),
  // perItem = 에셋별 기본(items.json look)을 항목에 들어갈 때마다 적용 — 설정에서 바꾼 값은 다음 항목까지만
  res: pick("res", "auto"), grain: pick("grain", 1, Number), perItem: pick("perItem", true, v => v !== "0" && v !== "false") };
if (![64, 90].includes(st.basis)) st.basis = 64;
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify({ filter: st.filter, v: st.v, level: st.level, normal: st.normal, normal3d: st.normal3d, rateMul: st.rateMul, fps: st.fps, fine: st.fine, auto3: st.auto, fit: st.fit, basis: st.basis, res: st.res, grain: st.grain, perItem: st.perItem })); } catch (e) {} };

// ---------- 넘김 목록: items.json의 vers(같은 덩어리의 판들)를 '판' 설정대로 편다 ----------
const VER = { "3d": "3D판", flat: "평면판" };
let LIST = [], PEND = [];                                   // PEND = 자리만 있는 판(src 없음) — 목록에 '준비 중'으로만
function build() {
  LIST = []; PEND = [];
  ITEMS.forEach((it, g) => {
    if (!it.vers) { LIST.push({ ...it, g }); return; }
    const { vers, ...base } = it, has = k => !!vers[k]?.src;
    for (const k of ["3d", "flat"].filter(has)) LIST.push({ ...base, ...vers[k], g, ver: k, style: k === "3d" ? "3d" : vers[k].style ?? base.style });
    for (const k of Object.keys(vers)) if (!has(k)) PEND.push({ g, ver: k, title: it.title });
  });
}
build();
// 예전 주소(?ver=…&i=…) — 판을 고르던 때(10/24 ~ 10/26 오전)의 목록 순서. 항목 제목 앞부분 | 판
const LEGACY = {
  "3d": ["시범 v2 · 새 기준 V1|3d", "시범 v2 · 새 기준 W3|3d", "세로 2|3d", "세로 1|3d", "서브 · 눈덩이|", "서브 · 숨바꼭질|3d", "서브 · 스노우|", "공식 쇼츠 · 푸빌라|", "공식 쇼츠 · 친구들|", "실시간|"],
  flat: ["세로 2|flat", "세로 1|flat", "서브 · 눈덩이|", "서브 · 숨바꼭질|flat", "서브 · 스노우|", "공식 쇼츠 · 푸빌라|", "공식 쇼츠 · 친구들|", "실시간|"],
  both: ["시범 v2 · 새 기준 V1|3d", "시범 v2 · 새 기준 W3|3d", "세로 2|flat", "세로 2|3d", "세로 1|flat", "세로 1|3d", "서브 · 눈덩이|", "서브 · 숨바꼭질|flat", "서브 · 숨바꼭질|3d", "서브 · 스노우|", "공식 쇼츠 · 푸빌라|", "공식 쇼츠 · 친구들|", "실시간|"] };
if (LEGACY[q.get("ver")]) {
  const [pre, v] = (LEGACY[q.get("ver")][st.i] || "|").split("|"), j = LIST.findIndex(e => pre && ITEMS[e.g].title.startsWith(pre) && (e.ver || "") === v);
  st.i = j >= 0 ? j : 0;
}
st.i = Math.min(st.i, LIST.length - 1);
// 이름: 제목의 ' — ' 앞이 짧은 이름, 뒤가 설명. 목록은 짧은 이름 (판), 아래 줄은 짧은 이름 (판) — 설명
const short = t => t.split(" — ")[0];
const label = (e, long) => (e.ver ? `${short(e.title)} (${VER[e.ver]})` : short(e.title)) + (long && e.title.includes(" — ") ? ` — ${e.title.split(" — ").slice(1).join(" — ")}` : "");

// 유화 필터 버전: 모두 유화 A 50 · 기준 값(결 · 프레임수 · 노말 · 해상도는 설정 · 에셋별 기본 그대로) 위에 세부 조정값 · 획 다시 놓기만 바꾼다.
// 1 = 기준(11/05 확정, 지금까지 공유 웹 그대로). 뒤 버전은 앞 버전 위에 쌓는다(tune · boil은 앞 버전 값을 이어받고 이 버전 값으로 덮는다).
// 값 근거 · 관문 결과는 texture_rnd/output/29_filter-package-v1/out/oil-research-1109/ 와 29번 README
const VERSIONS = [
  { id: "1", name: "기준", about: "11/05 확정값 + 남색 눈 · 코 둘레 번짐 정리(11/09 재연 님 '기본으로 올리기' — 옛 버전 4 '눈 또렷')" },
  { id: "2", name: "영상 안정", about: "획 다시 놓기 0(그림마다 2% 획을 새 자리에 놓던 것을 끔) — 원본 대비 초과 반짝임 57~95%, 결 그대로(11/09)", boil: 0 },
  { id: "3", name: "물감 층 · 광택", about: "나중 층 붓을 조금 높게 얹고(층 높이 0.05) 붓 옆 둑(0.1), 칠 덩어리 위 넓은 바니시 광택(0.12) · 붓털 광택 0.178 → 0.14 — 결 세기 99~100%, 반짝임 2번 대비 94~99%(11/09)",
    tune: { "OIL.layerH": 0.05, "OIL.ridge": 0.1, "OIL.varnish": 0.12, "OIL.spec": 0.14 } },
];
if (!VERSIONS.some(v => v.id === st.v)) st.v = "1";
if (st.filter !== "off") st.filter = "A";
const verOf = id => VERSIONS.find(v => v.id === id) || VERSIONS[0];
const verStack = id => VERSIONS.slice(0, VERSIONS.indexOf(verOf(id)) + 1);
const filter = createFilter($("out"), { filter: "A", level: st.level, normal: st.normal });
window.nauFilter = filter;
// 설정을 바꾸면 영상이 멈춰 있어도 한 장 새로 그린다(want). 필터 값은 모두 fset으로 바꾼다
let want = true;
const fset = o => { filter.set(o); want = true; };
// 기준 프레임수(필터가 1초에 새로 그리는 그림 수, fps): 0 = 필터마다 기본값. 기본값은 시작할 때 필터마다 한 번 읽어 둔다
// 60Hz 화면에서는 60을 나누는 12 · 15 · 20 · 30이 그림 간격이 고르다(21 · 24는 50ms · 33ms가 섞여 덜컥거린다 — 10/24 65인치 점검)
const FPS_DEF = {}; for (const f of FILTERS.filter(f => f.id === "A")) { filter.set({ filter: f.id }); FPS_DEF[f.id] = filter.options.fps; }
filter.set({ filter: "A" });
const BOIL_DEF = filter.options.boil;                        // 버전 1(기준)의 획 다시 놓기
const curId = () => "A";
const applyFps = () => fset({ fps: st.fps || FPS_DEF[curId()] });
applyFps();
let cur = null;
// 캐릭터 노말은 그림체별로 따로 기억한다: 평면 소스는 켬, 3D 소스(공식 쇼츠 · 3D 영상 · 실시간 미믹)는 끔이 기본(10/23 사용자 — 이미 입체인 3D에 노말을 얹으면 어색하다)
const is3d = () => !!cur && (cur.style === "3d" || !!cur.live);
const normalNow = () => is3d() ? st.normal3d : st.normal;
// 버전 적용: 세부 조정값을 비우고(필터 세기 값) 버전 묶음의 값을 차례로 얹는다
function applyVersion() {
  const stack = verStack(st.v), tune = Object.assign({}, ...stack.map(v => v.tune || {}));
  const boil = [...stack].reverse().find(v => v.boil !== undefined)?.boil ?? BOIL_DEF;
  fset({ filter: "A", tune: null }); if (Object.keys(tune).length) fset({ tune }); fset({ boil });
}
// 필터 처리 해상도: 1080으로 그려 4K(2160 폭) 화면에서 두 배로 늘리면 획이 뭉개진다(10/24 메인). 자동 = 그림이 차지하는 실제 화소(CSS × devicePixelRatio)에 가장 가까운
// 단계, 상한 2160. 모듈은 가상 해상도 1080 ÷ 결 크기로 셈하고(px = 해상도/가상) 획을 칠하는 판과 화면만 실제 해상도로 그린다 — 결 · 획 배치는 1080 그림 그대로,
// 가장자리만 또렷하게(해상도 1080 · 결 크기 1이면 지금 그림과 화소 단위로 같다). 결 크기 0.85 · 0.7 = 획을 그만큼 잘게(가까이 서서 보는 65인치용).

// ---------- 넘기기: 키보드 · 휠 · 끌기 ----------
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
  const k = e.key.toLowerCase();
  if (k === "arrowdown" || k === "arrowright" || k === "pagedown") { nav(1); e.preventDefault(); }
  else if (k === "arrowup" || k === "arrowleft" || k === "pageup") { nav(-1); e.preventDefault(); }
  else if (k === "0") { st.filter = "off"; sync(); note("원본"); }
  else if (VERSIONS.some(v => v.id === k)) { st.filter = "A"; st.v = k; applyFps(); applyVersion(); sync(); note(`필터 ${k} ${verOf(k).name}`); }
  else if (k === "[" || k === "]") { setLevel(st.level + (k === "]" ? 5 : -5)); note(`세기 ${st.level}`); }
  else if (k === "-" || k === "=") {                         // 초당 그림 한 단계 내리기 · 올리기
    const L = [8, 12, 15, 21, 24, 30], c = st.fps || FPS_DEF[curId()];
    st.fps = k === "=" ? (L.find(v => v > c) ?? L.at(-1)) : ([...L].reverse().find(v => v < c) ?? L[0]);
    applyFps(); sync(); note(`기준 프레임수 ${st.fps}fps`); }
  else if (k === "n") { toggleNormal(); note(normalNow() ? "노말 켬" : "노말 끔"); }
  else if (k === "b") { st.basis = st.basis === 64 ? 90 : 64; applyRate(true); sync(); note(st.basis === 64 ? "속도 기준 1:04 판 그대로" : "속도 기준 1:30 (×64/90)"); }
  else if (k === " ") { togglePlay(); e.preventDefault(); }
  else if (k === "f") toggleFull();
  else if (k === "s") togglePanel();
  else if (k === "escape") togglePanel(false);
});
let acc = 0, wheelLock = 0;
addEventListener("wheel", e => {
  if (e.target.closest(".panel")) return;
  acc += e.deltaY; const now = performance.now();
  if (now < wheelLock) return;
  if (Math.abs(acc) > 60) { nav(acc > 0 ? 1 : -1); acc = 0; wheelLock = now + 600; }
}, { passive: true });
let y0 = null;
$("stage").addEventListener("pointerdown", e => { y0 = e.clientY; togglePanel(false); });
$("stage").addEventListener("pointerup", e => { if (y0 !== null && Math.abs(e.clientY - y0) > innerHeight * .08) nav(e.clientY < y0 ? 1 : -1); y0 = null; });
document.addEventListener("click", e => { if (e.target.tagName === "BUTTON") e.target.blur(); });   // Space가 누른 단추를 다시 누르지 않게

// 아래 끝(바탕글 6줄 높이)에 마우스를 대면 아래 줄이 뜨고, 2.5초 움직임이 없으면 줄과 커서가 숨는다
let idleT = 0;
function wake(e) {
  const near = e ? e.clientY > innerHeight - 6 * parseFloat(getComputedStyle(document.documentElement).fontSize) : false;
  const open = document.body.classList.contains("panel-on");
  document.body.classList.toggle("dock-on", near || open);
  document.body.classList.remove("idle"); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!document.body.classList.contains("panel-on")) document.body.classList.remove("dock-on"); document.body.classList.add("idle"); }, 2500);
}
addEventListener("pointermove", wake);
document.addEventListener("fullscreenchange", () => { sync(); setTimeout(layout, 50); });

setTimeout(() => document.body.classList.remove("dock-on"), 2500);
await show(st.i);
requestAnimationFrame(frame);
</script>
