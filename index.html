<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>푸빌라 미믹</title>
    <!-- 홈 화면에 추가하면 주소창 없이 전체화면 앱처럼 열림 (안드로이드: manifest, 아이폰: apple-mobile-web-app) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F76A4B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="푸빌라" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; height: 100dvh; background: #0b0b0e; overflow: hidden; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      #stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(100vw, 56.25dvh); height: min(100dvh, 177.7777778vw); overflow: hidden; isolation: isolate; background: linear-gradient(#F76A4B,#E2462A); }
      #app { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
      #viewControls { position: absolute; z-index: 30; bottom: max(12px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: clamp(2px,1dvh,8px); padding: clamp(2px,1dvh,6px); border-radius: 28px; background: rgba(13,20,39,.35); backdrop-filter: blur(10px); }
      .view-control { flex: 0 0 min(40px,7dvh,calc((100vw - 52px)/5)); width: min(40px,7dvh,calc((100vw - 52px)/5)); height: min(40px,7dvh,calc((100vw - 52px)/5)); border-radius: 50%; border: 1px solid #ffffff35; display: grid; place-items: center; padding: 0; color: white; background: #18223890; cursor: pointer; font: 20px system-ui; }
      .view-control:hover { background: #334565dd; }
      .view-control:focus-visible { outline: 2px solid #ffe1a3; outline-offset: 2px; }
      #oilPanel { position: absolute; z-index: 31; bottom: 76px; left: 12px; right: 12px; max-width: 320px; max-height: calc(100% - 90px); overflow-y: auto; box-sizing: border-box; }
      body.controls-hidden #viewControls { display: none; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* 웹캠 프리뷰: 개발용. 키오스크에선 숨김 */
      #cam { position: fixed; right: 12px; bottom: 12px; width: auto; height: auto; max-width: min(240px,42vw); max-height: 50vh; border-radius: 8px; border: 1px solid #333; object-fit: contain; opacity: .9; }
      #cam.mirror { transform: scaleX(-1); }
      #stats { position: fixed; left: 12px; bottom: 12px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #cfd3dc; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 8px; white-space: pre; pointer-events: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #9aa0ad; font-size: 14px; letter-spacing: .02em; white-space: pre-line; text-align: center; line-height: 1.6; }
      body.kiosk #cam, body.kiosk #camWrap, body.kiosk #stats, body.kiosk .lil-gui { display: none !important; }
      body.kiosk, body.kiosk * { cursor: none !important; }
      /* 튜닝 패널이 오른쪽 아래 카메라/락온 영역 박스를 가리지 않게 */
      .lil-gui.lil-root { top: 12px; right: 12px; width: min(360px,calc(100vw - 24px)); max-height: max(120px,calc(100dvh - var(--camera-preview-height, 180px) - 100px)); overflow-y: auto; }
      body.debug-hidden #cam, body.debug-hidden #camWrap, body.debug-hidden #stats, body.debug-hidden .lil-gui { display: none !important; }
      body.controls-hidden .view-control, body.controls-hidden #oilPanel { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="app"></div><nav id="viewControls" aria-label="화면 조작"></nav></div>
    <video id="cam" autoplay muted playsinline></video>
    <div id="stats"></div>
    <div id="boot">로딩 중…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
